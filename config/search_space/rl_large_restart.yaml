_target_: search_space.cs.ConfigSpaceSearchSpace
hyperparameters:
  - name: log10_lr
    type: Float
    distribution: Uniform
    bounds: [ -4, -3 ]
  - name: discounting
    type: Float
    distribution: Uniform
    bounds: [ 0.9, 0.9999 ]
  - name: log10_entropy_cost
    type: Float
    distribution: Uniform
    bounds: [ -6, -1 ]
  - name: reward_scaling
    type: Float
    distribution: Uniform
    bounds: [ 0.05, 20 ]
  - name: lambda_
    type: Float
    distribution: Uniform
    bounds: [ 0.9, 1 ]
  - name: ppo_epsilon
    type: Float
    distribution: Uniform
    bounds: [ 0.1, 0.4 ]
  - name: log2_batch_size
    type: Integer
    distribution: Uniform
    bounds: [ 8, 10 ]
  - name: unroll_length
    type: Integer
    distribution: Uniform
    bounds: [ 5, 15 ]
  - name: num_update_epochs
    type: Integer
    distribution: Uniform
    bounds: [ 2, 8 ]
  - name: T_0
    type: Integer
    distribution: Uniform
    bounds: [ 5, 50 ]
  - name: T_mult
    type: Integer
    distribution: Uniform
    bounds: [ 1, 2 ]
  - name: log10_eta_min
    type: Float
    distribution: Uniform
    bounds: [ -8, -6 ]